<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Setting — Volleyball Tryouts</title>
<link rel="icon" href="assets/favicon.ico?v=14" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png?v=14" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png?v=14" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=14" />
<link rel="manifest" href="assets/site.webmanifest?v=14" />
<meta name="theme-color" content="#0b2545" />
<link rel="stylesheet" href="styles.css?v=14" />
</head>
<body>
<div class="app evaluator-app">
  <header class="top compact">
    <h1>Setting<span class="header-coach" id="headerCoach"></span></h1>
    <div class="header-actions">
      <button type="button" class="menu-btn" id="menuBtn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">⋮</button>
      <a class="back-link" href="index.html" style="color:#c3d0e0;">&larr; Skills</a>
      <div class="menu-panel" id="menuPanel" hidden>
        <label class="menu-label" for="coachSelect">Coach</label>
        <select id="coachSelect" aria-label="Coach">
          <option value="">Coach…</option>
        </select>
        <button type="button" class="menu-reset-btn" id="resetBtn">Reset This Page</button>
      </div>
    </div>
  </header>

  <div id="configBanner" class="banner" hidden>
    ⚠ Not connected to the Google Sheet yet. Deploy the Apps Script Web App
    and paste its URL into <code>config.js</code> — see README.md.
  </div>

  <div class="toast" id="toast"></div>

  <main class="evaluator-grid">
    <div class="col-players">
      <div id="playerRows" class="rows-col"></div>

      <div class="player-jog-label">Find player</div>
      <div class="player-jog-wrap">
        <div class="player-jog" id="playerJog"></div>
        <div class="player-jog-highlight"></div>
      </div>
    </div>

    <div class="score-rail">
      <button type="button" class="rail-btn rail-undo" id="undoBtn" disabled>UNDO</button>
      <div class="active-player-mini" id="activePlayerLabel">Load a group</div>

      <div class="set-batch-card" id="frontBatchCard">
        <div class="set-batch-label">Front Sets</div>
        <div class="set-batch-selects">
          <select id="frontMadeSelect" class="rail-select" aria-label="Front sets on target"></select>
          <span class="set-batch-of">of</span>
          <select id="frontBallsSelect" class="rail-select" aria-label="Front sets tested">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="15">15</option>
            <option value="20">20</option>
            <option value="25">25</option>
          </select>
        </div>
        <div class="set-batch-quality-row">
          <label for="frontQualitySelect" class="set-batch-quality-label">Quality</label>
          <select id="frontQualitySelect" class="rail-select" aria-label="Front set quality (0-5)">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>
        <button type="button" class="rail-btn set-batch-submit" id="btnFrontSubmit" disabled>Log Front</button>
      </div>

      <div class="set-batch-card" id="backBatchCard">
        <div class="set-batch-label">Back Sets</div>
        <div class="set-batch-selects">
          <select id="backMadeSelect" class="rail-select" aria-label="Back sets on target"></select>
          <span class="set-batch-of">of</span>
          <select id="backBallsSelect" class="rail-select" aria-label="Back sets tested">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="15">15</option>
            <option value="20">20</option>
            <option value="25">25</option>
          </select>
        </div>
        <div class="set-batch-quality-row">
          <label for="backQualitySelect" class="set-batch-quality-label">Quality</label>
          <select id="backQualitySelect" class="rail-select" aria-label="Back set quality (0-5)">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>
        <button type="button" class="rail-btn set-batch-submit" id="btnBackSubmit" disabled>Log Back</button>
      </div>
    </div>
  </main>
</div>

<script src="config.js?v=14"></script>
<script src="app.js?v=14"></script>
<script src="setting.js?v=14"></script>
</body>
</html>
